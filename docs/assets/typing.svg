<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 36" width="650" height="36" fill="none">
  <defs>
    <style>
      .prompt-symbol {
        font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
        font-size: 15px;
        font-weight: 700;
        fill: #38BDF8;
      }
      .typing-phrase {
        font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .cursor {
        fill: #00E5BF;
        animation: blink 0.8s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Staggered phrase opacity cycle across 16s total duration */
      .phrase-1 { animation: cyclePhrase1 16s infinite; }
      .phrase-2 { animation: cyclePhrase2 16s infinite; }
      .phrase-3 { animation: cyclePhrase3 16s infinite; }
      .phrase-4 { animation: cyclePhrase4 16s infinite; }

      @keyframes cyclePhrase1 {
        0% { opacity: 0; }
        2% { opacity: 1; }
        22% { opacity: 1; }
        24% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes cyclePhrase2 {
        0%, 24% { opacity: 0; }
        26% { opacity: 1; }
        47% { opacity: 1; }
        49% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes cyclePhrase3 {
        0%, 49% { opacity: 0; }
        51% { opacity: 1; }
        72% { opacity: 1; }
        74% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes cyclePhrase4 {
        0%, 74% { opacity: 0; }
        76% { opacity: 1; }
        97% { opacity: 1; }
        99% { opacity: 0; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Shell Prompt Glyph -->
  <text x="10" y="23" class="prompt-symbol">›</text>

  <!-- Rotating Phrases -->
  <g transform="translate(30, 23)">
    <!-- Phrase 1 -->
    <text x="0" y="0" class="typing-phrase phrase-1" fill="#00E5BF">
      Strictly causal discrete-event backtesting
    </text>

    <!-- Phrase 2 -->
    <text x="0" y="0" class="typing-phrase phrase-2" fill="#38BDF8">
      Microstructure-aware Level-2 execution simulation
    </text>

    <!-- Phrase 3 -->
    <text x="0" y="0" class="typing-phrase phrase-3" fill="#A5B4FC">
      Leakage-resistant purged &amp; embargoed econometrics
    </text>

    <!-- Phrase 4 -->
    <text x="0" y="0" class="typing-phrase phrase-4" fill="#34D399">
      Cryptographically auditable experiment ledger
    </text>
  </g>

  <!-- Trailing Terminal Cursor Block -->
  <rect x="475" y="10" width="8" height="16" rx="1" class="cursor"/>
</svg>

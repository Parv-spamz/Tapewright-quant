<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 36" width="600" height="36" fill="none">
  <defs>
    <style>
      .prompt-symbol {
        font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
        font-size: 15px;
        font-weight: 700;
        fill: #00E5BF;
      }
      .typing-phrase {
        font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .cursor {
        fill: #00E5BF;
        animation: blink 0.8s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* 3-phrase cycle across 9s total duration */
      .phrase-1 { animation: cyclePhrase1 9s infinite; }
      .phrase-2 { animation: cyclePhrase2 9s infinite; }
      .phrase-3 { animation: cyclePhrase3 9s infinite; }

      @keyframes cyclePhrase1 {
        0% { opacity: 0; }
        3% { opacity: 1; }
        30% { opacity: 1; }
        33% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes cyclePhrase2 {
        0%, 33% { opacity: 0; }
        36% { opacity: 1; }
        63% { opacity: 1; }
        66% { opacity: 0; }
        100% { opacity: 0; }
      }
      @keyframes cyclePhrase3 {
        0%, 66% { opacity: 0; }
        69% { opacity: 1; }
        97% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Shell Prompt Glyph -->
  <text x="10" y="23" class="prompt-symbol">›</text>

  <!-- Rotating Phrases -->
  <g transform="translate(30, 23)">
    <!-- Phrase 1: Simulate markets -->
    <text x="0" y="0" class="typing-phrase phrase-1" fill="#00E5BF">
      Simulate markets
    </text>

    <!-- Phrase 2: Test trading ideas -->
    <text x="0" y="0" class="typing-phrase phrase-2" fill="#E2E8F0">
      Test trading ideas
    </text>

    <!-- Phrase 3: Challenge the results -->
    <text x="0" y="0" class="typing-phrase phrase-3" fill="#38BDF8">
      Challenge the results
    </text>
  </g>

  <!-- Trailing Terminal Cursor Block -->
  <rect x="235" y="10" width="7" height="16" rx="1" class="cursor"/>
</svg>
